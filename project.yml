name: MioMei
options:
  bundleIdPrefix: com.projexsystem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: 79ZVQ4RMKX
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
      ENABLE_TESTABILITY: NO

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.1"

targets:
  MioMei:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/MioMei
      - path: Sources/MioMeiShared
    dependencies:
      - package: Supabase
        product: Supabase
      - target: MioMeiWidgets
        embed: true
    info:
      path: Sources/MioMei/Resources/Info.plist
      properties:
        CFBundleDisplayName: MioMei
        CFBundleURLTypes:
          - CFBundleURLName: com.projexsystem.miomei.oauth
            CFBundleURLSchemes:
              - miomei
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.projexsystem.miomei.sync
        NSSupportsLiveActivities: true
        MioMeiSupabaseHost: "$(SUPABASE_HOST)"
        MioMeiSupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projexsystem.miomei
        PRODUCT_NAME: MioMei
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - MioMeiTests
      gatherCoverageData: true

  MioMeiWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/MioMeiWidgets
      - path: Sources/MioMeiShared
    info:
      path: Sources/MioMeiWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projexsystem.miomei.widgets
        PRODUCT_NAME: MioMeiWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  MioMeiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MioMeiTests
    dependencies:
      - target: MioMei
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projexsystem.miomei.tests
        PRODUCT_NAME: MioMeiTests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MioMei.app/MioMei"
        BUNDLE_LOADER: "$(TEST_HOST)"
